version: '3.8'

services:
  # Backend API Server
  absentray-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: absentray-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_PATH=/app/data/attendance.db
      - LOG_FILE=/app/logs/app.log
      - WAHA_API_KEY=${WAHA_API_KEY}
      - FINGERPRINT_IP=${FINGERPRINT_IP:-192.168.100.102}
      - FINGERPRINT_PORT=${FINGERPRINT_PORT:-4370}
      - ADMIN_WHATSAPP=${ADMIN_WHATSAPP:-6281367675539}
      - WAHA_URL=${WAHA_URL:-http://192.168.100.180:5555}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backups:/app/backups
    networks:
      - absentray-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Static Server
  absentray-web:
    image: nginx:alpine
    container_name: absentray-web
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ../client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - absentray-api
    networks:
      - absentray-network

networks:
  absentray-network:
    driver: bridge