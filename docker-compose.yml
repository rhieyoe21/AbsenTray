# AbsenTray V2 — deployment single-container (API + frontend statis).
# Target: Ubuntu + Docker / CasaOS.
#
# Penggunaan:
#   cp deploy/docker.env.example .env        # lalu edit nilai
#   docker compose up -d --build
#
# Data persisten & impor awal:
#   ./data/          → database SQLite
#   ./logs/          → log aplikasi
#   ./backups/       → backup periodik
#   ./map_user.csv   → (opsional) impor karyawan saat start
#   ./sent_log.txt   → (opsional) migrasi riwayat terkirim
#
# Akses:  http://<HOST>:105

services:
  absentray:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: absentray:local
    container_name: absentray
    restart: unless-stopped
    # ZKTeco device accepts the host LAN source, but resets connections from
    # Docker bridge/NAT. Host networking keeps the container on the same LAN
    # interface as the server. Supported on Linux/CasaOS deployments.
    network_mode: host
    environment:
      - NODE_ENV=production
      - SERVE_CLIENT=1
      - PORT=105
      # Zona waktu aplikasi (log & pembuatan timestamp). Container base OS
      # biasanya UTC — perlu diarahkan eksplisit agar jadwal polling & balasan
      # waktu tampil di Asia/Jakarta.
      - APP_TIMEZONE=${APP_TIMEZONE:-Asia/Jakarta}
      - FINGERPRINT_IP=${FINGERPRINT_IP:-192.168.1.102}
      - FINGERPRINT_PORT=${FINGERPRINT_PORT:-4370}
      - FINGERPRINT_TIMEOUT=${FINGERPRINT_TIMEOUT:-10000}
      - POLLING_INTERVAL=${POLLING_INTERVAL:-30000}
      - WAHA_URL=${WAHA_URL:-http://192.168.1.180:5555}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION=${WAHA_SESSION:-default}
      - ADMIN_WHATSAPP=${ADMIN_WHATSAPP:-628XXXXXXXXXX}
      # CORS: '*' berarti izinkan akses dari IP/domain mana pun (disarankan utk
      # akses langsung. Ganti dgn origin spesifik jika perlu.
      - CLIENT_URL=${CLIENT_URL:-*}
      # Rate limit API per IP (naikkan bila dashboard "Too many requests")
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-1000}
      - RATE_LIMIT_WHITELIST=${RATE_LIMIT_WHITELIST:-127.0.0.1}
      # =1 bila di belakang reverse proxy agar IP client terbaca benar
      - TRUST_PROXY=${TRUST_PROXY:-0}
    volumes:
      - ./data:/app/server/data
      - ./logs:/app/server/logs
      - ./backups:/app/server/backups
      # Opsional: data untuk impor saat container start
      - ./map_user.csv:/app/server/map_user.csv:ro
      - ./sent_log.txt:/app/server/sent_log.txt:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:105/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
